name: HomeAccess
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HomeAccess:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.khaledez.homeaccess
        PRODUCT_NAME: HomeAccess
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Home Access
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the invite QR code to set up access.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
  HomeAccessTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HomeAccess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.khaledez.homeaccess.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HomeAccess:
    build:
      targets:
        HomeAccess: all
    test:
      targets: [HomeAccessTests]
