name: HomeAccess
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: H575GQ7N4W
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HomeAccess:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.khaledez.homeaccess
        PRODUCT_NAME: HomeAccess
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Home Access
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the invite QR code to set up access.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HomeAccessTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HomeAccess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.khaledez.homeaccess.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HomeAccess:
    build:
      targets:
        HomeAccess: all
    test:
      targets: [HomeAccessTests]
